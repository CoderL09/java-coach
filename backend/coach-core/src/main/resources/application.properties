server.address=127.0.0.1
server.port=8091
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/trace_coach?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=6
spring.flyway.enabled=true
mybatis.configuration.map-underscore-to-camel-case=true
spring.data.redis.host=127.0.0.1
spring.data.redis.port=${REDIS_PORT:6388}
spring.session.redis.namespace=trace:session
server.servlet.session.cookie.name=TRACESESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
server.error.include-message=never
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
trace.admin-password=${ADMIN_PASSWORD:}
trace.runner-enabled=${RUNNER_ENABLED:false}
trace.runtime=${TRACE_RUNTIME:../runtime}
trace.ai-key=${DEEPSEEK_API_KEY:}
trace.ai-model=${DEEPSEEK_MODEL:deepseek-flash}
